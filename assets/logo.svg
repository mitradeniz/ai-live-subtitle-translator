<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="AI Live Subtitle Translator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18215a"/>
      <stop offset=".55" stop-color="#0d1230"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
    <clipPath id="tile"><rect x="4" y="4" width="120" height="120" rx="32"/></clipPath>
    <filter id="aurora" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="han" gradientUnits="userSpaceOnUse" x1="66" y1="20" x2="104" y2="68">
      <stop offset="0" stop-color="#b9f3ff"/>
      <stop offset="1" stop-color="#c9b5ff"/>
    </linearGradient>
    <clipPath id="lens"><rect x="16" y="46" width="72" height="64" rx="23"/></clipPath>
    <filter id="refract" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="6" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="lensRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="caustic" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#d9f6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d9f6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="4" y="4" width="120" height="120" fill="url(#bg)"/>
    <g filter="url(#aurora)">
      <circle cx="30" cy="26" r="34" fill="#3f5bff" opacity=".95"/>
      <circle cx="116" cy="70" r="30" fill="#14b9d0" opacity=".8"/>
      <circle cx="46" cy="124" r="36" fill="#8a4fff" opacity=".85"/>
    </g>
  </g>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="31.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <g fill="none" stroke="url(#han)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 21v6"/>
    <path d="M67 32h36"/>
    <path d="M74 34c3 14 12 25 27 32"/>
    <path d="M96 34c-4 15-13 26-28 33"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="16" y="46" width="72" height="64" rx="23" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#lens)">
    <g filter="url(#refract)" transform="translate(-4 4) scale(1.02)" fill="none" stroke="url(#han)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
      <path d="M67 32h36"/>
      <path d="M74 34c3 14 12 25 27 32"/>
      <path d="M96 34c-4 15-13 26-28 33"/>
    </g>
    <rect x="16" y="46" width="72" height="64" rx="23" fill="#ffffff" opacity=".06"/>
    <ellipse cx="52" cy="112" rx="40" ry="16" fill="url(#caustic)"/>
  </g>
  <rect x="16.8" y="46.8" width="70.4" height="62.4" rx="22.2" fill="none" stroke="url(#lensRim)" stroke-width="1.6"/>
  <path d="M30 51.5Q52 47.5 74 51.5" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/>

  <g fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37 96 52 60.5 67 96"/>
    <path d="M42.6 84h18.8"/>
  </g>
</svg>
